<!DOCTYPE html>
<html lang="en" data-accent="academia" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CatchUp Planner — Demo</title>
<meta name="description" content="CatchUp Planner: a calm exam catch-up planner with balanced study days, streaks and a focus timer. Works offline, your data stays in your browser.">
<meta name="theme-color" content="#141A17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23141A17'/%3E%3Cpath d='M12 4.8L13.5 10.5 19.2 12 13.5 13.5 12 19.2 10.5 13.5 4.8 12 10.5 10.5z' fill='%23C9A96A'/%3E%3C/svg%3E">
<script>
/* Apply saved theme before first paint (no flash). Reads the same LS key the app uses. */
(function(){
  var r=document.documentElement;
  try{
    var s=JSON.parse(localStorage.getItem('catchup-planner.v1')||'{}');
    var t=(s.theme==='scandinavian'||s.theme==='cozy')?s.theme:'academia';
    r.dataset.accent=t;
    if(t==='academia'){ r.dataset.mode='dark'; }
    else{
      var m=s.mode||'auto';
      var dark = m==='dark' || (m==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      r.dataset.mode=dark?'dark':'light';
    }
  }catch(e){ r.dataset.accent='academia'; r.dataset.mode='dark'; }
})();
</script>
<style>
/* ==========================================================================
   CatchUp Planner — single-file app
   1. Base tokens (defaults = Modern Dark Academia)
   2. Base components (read tokens only)
   3. THEME: academia   4. THEME: scandinavian   5. THEME: cozy
   6. Responsive   7. Print / motion
   ========================================================================== */

/* ---------- 1. BASE TOKENS ---------- */
:root{
  --font-head:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --r:6px; --r-btn:6px;
  --bg:#141A17; --bg-glow:radial-gradient(640px 420px at 86% -6%, rgba(42,58,47,.6), transparent 70%);
  --text:#EFE3C4; --muted:#A8A08A;
  --panel:#1D2522; --panel-2:#19211E;
  --line:rgba(239,227,196,.14); --hairline:rgba(239,227,196,.18);
  --accent:#AD9565; --accent-strong:#C9A96A; --accent-ink:#241D10;
  --primary:#542B3A; --primary-strong:#6A3850; --primary-ink:#F2E4D5;
  --p-bg:linear-gradient(180deg,#F1E8D5,#EBDFC6); --p-ink:#26231C; --p-muted:#6E6654; --p-line:rgba(38,35,28,.16); --p-border:#D3C6A8;
  --ok:#7C8F6B; --ok-ink:#9DB48A; --warn:#C9A66B; --danger:#B05A64; --danger-bg:rgba(176,90,100,.16);
  --nav-bg:#0B100D; --nav-line:rgba(173,149,101,.4);
  --chip-bg:rgba(173,149,101,.1);
  --shadow-card:none; --shadow-pop:0 18px 50px rgba(0,0,0,.5);
  --track:rgba(124,143,107,.35);
  color-scheme:dark;
}
html[data-accent="scandinavian"]{ color-scheme:light; }
html[data-accent="cozy"]{ color-scheme:light; }
html[data-accent="scandinavian"][data-mode="dark"]{ color-scheme:dark; }
html[data-accent="cozy"][data-mode="dark"]{ color-scheme:dark; }

/* ---------- 2. BASE ---------- */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--font-body); background:var(--bg); background-image:var(--bg-glow);
  color:var(--text); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh;
}
img,svg{ display:block; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
input,textarea,select{ font:inherit; color:inherit; }
h1,h2,h3,h4,p{ margin:0; }
.num{ font-variant-numeric:tabular-nums; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
.wrap{ max-width:1060px; margin:0 auto; padding:0 18px calc(96px + env(safe-area-inset-bottom)); }
.screen{ display:none; }
.screen.active{ display:block; animation:fadeIn .24s ease; }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }

/* Demo bar */
.demo-bar{ background:var(--nav-bg); color:var(--muted); border-bottom:1px solid var(--nav-line); font-size:.74rem; text-align:center; padding:6px 12px; }
.demo-bar button{ color:var(--accent-strong); font-weight:600; text-decoration:underline; min-height:0; padding:0 4px; font-size:inherit; }

/* Top bar */
.topbar{
  position:sticky; top:0; z-index:40;
  background:var(--topbar-bg,var(--nav-bg));
  border-bottom:1px solid var(--topbar-line,var(--nav-line));
}
.topbar-in{
  max-width:1060px; margin:0 auto; padding:10px 18px;
  display:flex; align-items:center; gap:10px;
}
.brand{ display:flex; align-items:center; gap:10px; min-width:0; cursor:pointer; }
.brand .logo{ width:38px; height:38px; flex:0 0 auto; }
.brand-name{ line-height:1.05; min-width:0; }
.brand-name b{ font-family:var(--font-head); font-weight:600; font-size:1.16rem; letter-spacing:.01em; display:block; white-space:nowrap; }
.brand-name span{ font-size:.52rem; letter-spacing:.34em; text-transform:uppercase; color:var(--muted); display:block; margin-top:2px; }
.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:8px; }
.streak-chip{
  display:inline-flex; align-items:center; gap:7px; min-height:38px;
  padding:5px 12px 5px 9px; border:1px solid var(--accent); border-radius:var(--r-btn);
  background:var(--chip-bg); color:var(--accent-strong);
}
.streak-chip svg{ width:17px; height:17px; color:#D98E5A; }
.streak-chip b{ font-family:var(--font-head); font-size:1.02rem; line-height:1; }
.streak-chip small{ font-size:.5rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); display:block; }
.icon-btn{
  width:44px; height:44px; border-radius:var(--r-btn);
  display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;
  border:1px solid transparent; color:var(--text); transition:background .15s ease,border-color .15s ease;
}
.icon-btn:hover{ background:var(--chip-bg); }
.icon-btn svg{ width:20px; height:20px; }
.icon-btn.lined{ border-color:var(--hairline); }

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.55rem;
  min-height:46px; padding:0 1.1rem; border-radius:var(--r-btn);
  font-weight:600; font-size:.92rem; letter-spacing:.01em; white-space:nowrap;
  border:1px solid transparent; transition:filter .15s ease,background .15s ease,transform .06s ease;
}
.btn:active{ transform:translateY(1px); }
.btn svg{ width:18px; height:18px; flex:0 0 auto; }
.btn-primary{ background:var(--primary); color:var(--primary-ink); }
.btn-primary:hover{ background:var(--primary-strong); }
.btn-accent{ background:var(--accent-strong); color:var(--accent-ink); }
.btn-accent:hover{ filter:brightness(1.05); }
.btn-dark{ background:var(--btn-dark-bg,#24413A); color:var(--btn-dark-ink,#EFE3C4); border-color:var(--btn-dark-line,#3E5D4F); }
.btn-outline{ border-color:var(--accent); color:var(--accent-strong); background:transparent; }
.btn-outline:hover{ background:var(--chip-bg); }
.btn-ghost{ color:var(--text); background:var(--chip-bg); }
.btn-ghost:hover{ filter:brightness(1.08); }
.btn-text{ color:var(--accent-strong); min-height:44px; padding:0 .5rem; font-weight:600; }
.btn-danger{ color:var(--danger); border-color:var(--danger); background:transparent; }
.btn-sm{ min-height:38px; padding:0 .8rem; font-size:.85rem; }
.btn-block{ width:100%; }

/* Eyebrow / masthead */
.eyebrow{
  display:flex; align-items:center; gap:10px;
  font-size:.66rem; font-weight:600; letter-spacing:.24em; text-transform:uppercase;
  color:var(--accent-strong);
}
.eyebrow::after{ content:''; width:34px; height:1px; background:var(--accent); opacity:.7; }
.masthead{ position:relative; padding:26px 0 8px; }
.mast-eyebrow{ margin-bottom:10px; }
.headline{
  font-family:var(--font-head); font-weight:600; letter-spacing:-.01em; line-height:1.08;
  font-size:clamp(1.9rem,6.4vw,2.55rem); max-width:24ch;
}
.mast-sub{ margin-top:10px; color:var(--muted); font-size:.95rem; max-width:52ch; }
.mast-meta{
  display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center;
  font-size:.76rem; color:var(--muted); margin-bottom:12px; letter-spacing:.02em;
}
.mast-meta b{ color:var(--text); font-weight:600; }
.mast-meta .dot{ width:3px; height:3px; border-radius:50%; background:var(--muted); opacity:.7; }
.mast-illus{
  position:absolute; right:-12px; top:6px; width:min(46%,300px); pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 26%); mask-image:linear-gradient(90deg,transparent,#000 26%);
}
@media (max-width:719px){ .mast-illus{ width:40%; top:16px; opacity:.9; } .masthead .headline,.masthead .mast-sub{ max-width:78%; } }
.mast-actions{ display:flex; flex-wrap:wrap; gap:10px; margin:16px 0 4px; position:relative; z-index:2; }

/* Chapter title w/ hairline */
.chapter{ display:flex; align-items:baseline; gap:12px; margin:26px 0 4px; }
.chapter h2{ font-family:var(--font-head); font-weight:600; font-size:1.3rem; letter-spacing:.01em; white-space:nowrap; }
.chapter .rule{ flex:1; height:1px; background:var(--hairline); align-self:center; }
.chapter .aux{ font-size:.75rem; color:var(--muted); white-space:nowrap; }

/* Panels */
.panel{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:18px; position:relative;
}
.panel + .panel{ margin-top:14px; }
.panel-h{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.panel-h .pic{ width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; background:var(--chip-bg); color:var(--accent-strong); }
.panel-h .pic svg{ width:18px; height:18px; }
.panel-h h3{ font-family:var(--font-head); font-weight:600; font-size:1.22rem; letter-spacing:.01em; flex:1; }
.panel-h .side{ font-size:.8rem; color:var(--muted); }
.panel.parchment{ background:var(--p-bg); border-color:var(--p-border); color:var(--p-ink); }
.panel.parchment .panel-h .pic{ background:rgba(84,43,58,.1); color:#542B3A; }
.panel.parchment .panel-h .side,.panel.parchment .muted{ color:var(--p-muted); }

/* Metric rows */
.metric-row{ display:grid; gap:0; }
.metric{ display:flex; align-items:center; gap:12px; padding:10px 2px; }
.metric + .metric{ border-top:1px solid var(--p-line); }
.metric svg{ width:20px; height:20px; color:var(--accent); flex:0 0 auto; }
.metric.parchment svg{ color:#8A7448; }
.metric .lbl{ font-size:.86rem; color:var(--muted); flex:1; min-width:0; }
.metric.parchment .lbl{ color:var(--p-muted); }
.metric .val{ font-family:var(--font-head); font-weight:600; font-size:1.45rem; line-height:1; white-space:nowrap; }
.metric .val small{ font-size:.8rem; font-weight:400; font-family:var(--font-body); color:var(--muted); margin-left:2px; }

/* Progress bars */
.bar{ height:10px; border-radius:99px; background:var(--track); overflow:hidden; position:relative; }
.bar > i{ display:block; height:100%; border-radius:99px; background:var(--accent-strong); transition:width .4s ease; }
.bar.knob::before{
  content:''; position:absolute; top:50%; left:0; width:14px; height:14px; border-radius:50%;
  background:var(--accent-strong); transform:translate(-2px,-50%); transition:left .4s ease;
}
.bar.thin{ height:4px; }
.bar.thin > i{ background:var(--accent-strong); }
.prog-caption{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-top:8px; font-size:.82rem; color:var(--muted); }
.prog-caption .big{ font-family:var(--font-head); font-size:1.35rem; color:var(--text); font-weight:600; }
.prog-caption .big small{ display:block; font-family:var(--font-body); font-size:.72rem; color:var(--muted); font-weight:400; }

/* Chips */
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:99px;
  font-size:.72rem; font-weight:600; letter-spacing:.02em; background:var(--chip-bg); color:var(--muted);
  border:1px solid var(--line); white-space:nowrap;
}
.chip .cdot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
.chip.ok{ color:var(--ok-ink); border-color:rgba(124,143,107,.4); background:rgba(124,143,107,.12); }
.chip.warn{ color:var(--warn); border-color:rgba(201,166,107,.4); background:rgba(201,166,107,.12); }
.chip.bad{ color:var(--danger); border-color:rgba(176,90,100,.45); background:var(--danger-bg); }
.tagchip{ font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700; }

/* Rating segments */
.segs{ display:inline-flex; gap:3px; align-items:center; }
.segs i{ width:9px; height:9px; border-radius:2px; background:var(--track); }
.segs i.on{ background:var(--accent-strong); }

/* Session list rows */
.slist{ display:flex; flex-direction:column; }
.srow{
  display:grid; grid-template-columns:2.1rem 1fr auto; gap:10px; align-items:center;
  padding:11px 2px; border-bottom:1px solid var(--line); min-height:52px; width:100%; text-align:left;
}
.srow:last-child{ border-bottom:0; }
.srow .seq{ font-family:var(--font-head); font-style:italic; font-size:1.02rem; color:var(--accent-strong); }
.srow .st{ min-width:0; }
.srow .st b{ display:block; font-size:.95rem; font-weight:600; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.srow .st small{ display:block; font-size:.74rem; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.srow .st small .subj{ color:var(--accent-strong); font-weight:600; }
.srow.done{ opacity:.52; }
.srow.done .st b{ text-decoration:line-through; font-weight:500; }
.srow.urgent{ box-shadow:inset 3px 0 0 var(--danger); padding-left:10px; border-radius:2px; }
.donebtn{
  width:44px; height:44px; border-radius:50%; border:1.6px solid var(--line);
  display:inline-flex; align-items:center; justify-content:center; color:var(--muted);
  flex:0 0 auto; transition:all .15s ease;
}
.donebtn svg{ width:18px; height:18px; }
.donebtn:hover{ border-color:var(--accent-strong); color:var(--accent-strong); }
.donebtn.on{ background:var(--ok); border-color:var(--ok); color:#141A17; }

/* Exam readiness rows */
.exrows{ display:flex; flex-direction:column; }
.exrow{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:12px 2px; border-bottom:1px solid var(--line); min-height:56px; }
.exrow:last-child{ border-bottom:0; }
.exrow.urgent{ box-shadow:inset 3px 0 0 var(--danger); padding-left:10px; border-radius:2px; }
.exrow .cdot{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
.exrow .nm{ flex:1; min-width:120px; }
.exrow .nm b{ display:block; font-size:.96rem; font-weight:600; }
.exrow .nm small{ color:var(--muted); font-size:.74rem; }
.exrow .cov{ font-size:.86rem; color:var(--muted); white-space:nowrap; }
.exrow .cov b{ color:var(--text); font-size:1rem; }
@media (max-width:719px){
  .exrow{ display:grid; grid-template-columns:auto 1fr auto; grid-template-rows:auto auto; gap:6px 12px; align-items:center; }
  .exrow .cdot{ grid-row:1; align-self:start; margin-top:5px; }
  .exrow .exam-tile{ grid-row:1 / span 2; align-self:center; }
  .exrow .nm{ grid-column:2; grid-row:1; }
  .exrow .cov{ grid-column:3; grid-row:1; text-align:right; }
  .exrow .chip{ grid-column:2; grid-row:2; justify-self:start; }
  .exrow .segs{ grid-column:3; grid-row:2; justify-self:end; }
}

/* Hero cards (layered) */
.hero-cards{ position:relative; margin-top:18px; display:flex; flex-direction:column; }
.card{ border-radius:var(--r); padding:20px; position:relative; }
.card-start{ background:var(--panel); border:1px solid var(--line); }
.card-start.parchment{ background:var(--p-bg); border-color:var(--p-border); color:var(--p-ink); }
.card-progress{ background:var(--panel); border:1px solid var(--accent); width:min(88%,360px); margin:-1.5rem 0 0 auto; z-index:2; box-shadow:var(--shadow-card); }
.card-kicker{ font-size:.62rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--accent-strong); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.card-kicker::after{ content:''; flex:1; height:1px; background:var(--hairline); }
.sess-title{ font-family:var(--font-head); font-weight:600; font-size:1.42rem; line-height:1.18; letter-spacing:.005em; }
.sess-meta{ display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:8px; font-size:.8rem; color:var(--muted); align-items:center; }
.quote{
  margin:12px 0 2px; padding:8px 12px; border-left:2px solid var(--accent);
  font-family:var(--font-head); font-style:italic; font-size:.92rem; color:inherit; opacity:.85;
}
.card-btns{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.bigstat{ font-family:var(--font-head); font-weight:600; font-size:1.85rem; line-height:1; }
.bigstat small{ font-size:.95rem; font-weight:400; color:var(--muted); }
.mini-rows{ margin-top:12px; display:flex; flex-direction:column; }
.mini-row{ display:flex; justify-content:space-between; gap:10px; font-size:.8rem; padding:7px 0; border-bottom:1px solid var(--line); color:var(--muted); }
.mini-row:last-child{ border-bottom:0; }
.mini-row b{ color:var(--text); font-weight:600; }

/* Empty state */
.empty{ text-align:center; padding:44px 18px 30px; }
.empty .illus svg{ width:130px; height:96px; margin:0 auto 14px; opacity:.9; }
.empty h3{ font-family:var(--font-head); font-size:1.35rem; font-weight:600; }
.empty p{ color:var(--muted); font-size:.92rem; max-width:42ch; margin:8px auto 18px; }
.empty .card-btns{ justify-content:center; }

/* Forms */
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:.74rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
.field input[type=text],.field input[type=date],.field input[type=number],.field textarea,select{
  width:100%; min-height:46px; background:transparent; border:1px solid var(--line);
  border-radius:var(--r-btn); padding:10px 12px; color:var(--text);
}
.panel.parchment .field input,.panel.parchment .field textarea{ border-color:var(--p-line); color:var(--p-ink); }
.field textarea{ min-height:84px; resize:vertical; }
.field input:focus,.field textarea:focus{ outline:none; border-color:var(--accent-strong); }
.swatches{ display:flex; gap:10px; flex-wrap:wrap; }
.swatch{ width:38px; height:38px; border-radius:50%; border:2px solid transparent; position:relative; }
.swatch.on{ border-color:var(--text); }
.swatch.on::after{ content:''; position:absolute; inset:5px; border-radius:50%; border:2px solid var(--bg); }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:var(--r-btn); overflow:hidden; }
.seg button{ min-height:44px; padding:0 14px; font-size:.84rem; font-weight:600; color:var(--muted); }
.seg button.on{ background:var(--chip-bg); color:var(--text); }
.switch{ position:relative; width:50px; height:28px; border-radius:99px; background:var(--track); border:1px solid var(--line); flex:0 0 auto; transition:background .2s ease; }
.switch::after{ content:''; position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:var(--muted); transition:all .2s ease; }
.switch.on{ background:var(--ok); }
.switch.on::after{ left:24px; background:#fff; }
.setrow{ display:flex; align-items:center; gap:14px; padding:14px 2px; border-bottom:1px solid var(--line); }
.setrow:last-child{ border-bottom:0; }
.setrow .info{ flex:1; min-width:0; }
.setrow .info b{ display:block; font-size:.95rem; font-weight:600; }
.setrow .info small{ color:var(--muted); font-size:.78rem; display:block; margin-top:2px; }

/* Theme cards */
.themecards{ display:grid; gap:12px; }
.themecard{
  text-align:left; border:1px solid var(--line); border-radius:var(--r); padding:14px;
  display:flex; gap:14px; align-items:center; transition:border-color .15s ease; background:var(--panel-2);
}
.themecard.on{ border-color:var(--accent-strong); }
.themecard .prev{ width:74px; height:58px; border-radius:6px; flex:0 0 auto; position:relative; overflow:hidden; border:1px solid var(--line); }
.themecard .prev i{ position:absolute; border-radius:2px; }
.themecard b{ display:block; font-size:.98rem; }
.themecard small{ color:var(--muted); font-size:.78rem; display:block; margin-top:2px; }
.themecard .tick{ margin-left:auto; width:26px; height:26px; border-radius:50%; border:1.4px solid var(--line); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.themecard.on .tick{ background:var(--accent-strong); border-color:var(--accent-strong); color:var(--accent-ink); }
.themecard .tick svg{ width:14px; height:14px; }

/* Chart */
.chart-wrap svg{ width:100%; height:auto; }
.legend{ display:flex; gap:14px; font-size:.76rem; color:var(--muted); align-items:center; flex:0 0 auto; }
.legend i{ width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px; }
.legend .lp i{ background:var(--chart-planned,#C9A96A); }
.legend .lc i{ background:var(--chart-done,#6E8464); }

/* Bottom nav */
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--nav-bg); border-top:1px solid var(--nav-line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-in{ max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); position:relative; }
.nav-btn{
  min-height:58px; padding:8px 2px 9px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--muted); font-size:.66rem; font-weight:600; letter-spacing:.03em; position:relative;
  -webkit-tap-highlight-color:transparent;
}
.nav-btn svg{ width:21px; height:21px; }
.nav-btn.on{ color:var(--accent-strong); }
.navleaf{ position:absolute; top:6px; width:20px; height:34px; color:var(--accent); opacity:.4; pointer-events:none; }
.navleaf.l{ left:6px; } .navleaf.r{ right:6px; transform:scaleX(-1); }

/* Modal */
.modal-overlay{
  position:fixed; inset:0; z-index:60; background:rgba(8,12,9,.62);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  display:flex; align-items:flex-end; justify-content:center; padding:16px;
}
html[data-accent="scandinavian"] .modal-overlay,html[data-accent="cozy"] .modal-overlay{ align-items:center; }
@media (min-width:560px){ .modal-overlay{ align-items:center; } }
.modal-overlay[hidden]{ display:none; }
.modal{
  width:100%; max-width:440px; max-height:86vh; overflow:auto;
  background:var(--modal-bg,var(--panel)); color:var(--modal-ink,var(--text));
  border:1px solid var(--line); border-radius:calc(var(--r) + 4px);
  padding:20px; box-shadow:var(--shadow-pop); animation:pop .22s ease;
}
@keyframes pop{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:none;} }
.modal-h{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.modal-h h3{ font-family:var(--font-head); font-size:1.25rem; font-weight:600; flex:1; }
.modal .x{ margin:-6px -6px 0 0; }
.modal-foot{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
.modal-foot .btn{ flex:1; }
.checkrow{ display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); }
.checkrow:last-child{ border-bottom:0; }
.checkrow .box{
  width:30px; height:30px; border-radius:6px; border:1.6px solid var(--line); flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; color:transparent;
}
.checkrow .box.on{ background:var(--ok); border-color:var(--ok); color:#141A17; }
.checkrow .box svg{ width:14px; height:14px; }
.checkrow span{ flex:1; font-size:.92rem; min-width:0; }
.checkrow .box.on + span{ color:var(--muted); text-decoration:line-through; }
.addcheck{ display:flex; gap:8px; margin-top:10px; }
.addcheck input{ flex:1; min-height:42px; background:transparent; border:1px solid var(--line); border-radius:var(--r-btn); padding:8px 12px; color:inherit; }

/* Focus timer */
.timer-big{ font-family:var(--font-head); font-weight:600; font-size:3.4rem; text-align:center; letter-spacing:.02em; margin:10px 0 2px; }
.timer-sub{ text-align:center; color:var(--muted); font-size:.85rem; margin-bottom:16px; }

/* Toast */
.toast-wrap{ position:fixed; left:0; right:0; bottom:calc(76px + env(safe-area-inset-bottom)); display:flex; justify-content:center; z-index:70; pointer-events:none; padding:0 16px; }
.toast{
  background:var(--toast-bg,#2A342C); color:var(--toast-ink,#EFE3C4); border:1px solid var(--accent);
  border-radius:8px; padding:11px 18px; font-size:.88rem; font-weight:500; max-width:92%;
  box-shadow:0 10px 30px rgba(0,0,0,.4); animation:pop .2s ease;
}
.muted{ color:var(--muted); }
.tiny{ font-size:.74rem; }
.hr{ height:1px; background:var(--line); border:0; margin:14px 0; }

/* ==========================================================================
   3. THEME — MODERN DARK ACADEMIA (always dark)
   Dark cinematic masthead, parchment panels w/ ink, gold hairlines,
   burgundy primary buttons, chapter titles, leaf-sprig nav.
   ========================================================================== */
html[data-accent="academia"]{
  --toast-bg:#242E27; --toast-ink:#EFE3C4; --modal-bg:#1D2522; --modal-ink:#EFE3C4;
  --btn-dark-bg:#24413A; --btn-dark-ink:#EFE3C4; --btn-dark-line:#3E5D4F;
}
html[data-accent="academia"] .brand-name b{ color:var(--accent-strong); }
html[data-accent="academia"] .topbar{ background:linear-gradient(180deg,#0E1411,#0B100D); }

html[data-accent="academia"] .headline{ font-style:normal; }
html[data-accent="academia"] .mast-sub{ font-family:var(--font-head); font-style:italic; font-size:1.02rem; color:#CBBF9E; }
html[data-accent="academia"] .mast-illus{ width:min(52%,340px); top:-4px; opacity:.96; }

/* Hero cards */
html[data-accent="academia"] .card-start.parchment{ box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 8px 24px rgba(0,0,0,.28); }
html[data-accent="academia"] .card-start .card-kicker{ color:#8A7448; }
html[data-accent="academia"] .card-start .card-kicker::after{ background:rgba(38,35,28,.2); }
html[data-accent="academia"] .card-start .sess-meta{ color:var(--p-muted); }
html[data-accent="academia"] .card-start .donebtn{ border-color:rgba(38,35,28,.3); color:var(--p-muted); }
html[data-accent="academia"] .card-start .donebtn:hover{ border-color:#542B3A; color:#542B3A; }
html[data-accent="academia"] .card-start .donebtn.on{ background:#5C6E4F; border-color:#5C6E4F; color:#F2EAD8; }
html[data-accent="academia"] .card-progress{ background:linear-gradient(180deg,#202B26,#1B241F); }
html[data-accent="academia"] .card-progress .bar{ background:rgba(124,143,107,.28); }
html[data-accent="academia"] .card-progress .mini-row b{ color:#EFE3C4; }

/* Chapter + parchment sections */
html[data-accent="academia"] .panel.gold-edge{ border-color:rgba(173,149,101,.55); background:linear-gradient(180deg,#212B26,#1B241F); }
html[data-accent="academia"] .script-note{
  position:absolute; top:14px; right:18px; font-family:var(--font-head); font-style:italic;
  font-size:.88rem; color:#5A4F38; text-align:right; line-height:1.25; transform:rotate(-2deg);
}
html[data-accent="academia"] .script-note svg{ display:block; margin:2px 0 0 auto; width:74px; height:10px; }
html[data-accent="academia"] .metric-row.three{ grid-template-columns:1fr; }
html[data-accent="academia"] .panel.parchment .chip{ border-color:rgba(38,35,28,.2); background:rgba(38,35,28,.06); color:var(--p-muted); }
html[data-accent="academia"] .panel.parchment .icon-btn{ color:var(--p-ink); }
html[data-accent="academia"] .panel.parchment .icon-btn:hover{ background:rgba(38,35,28,.08); }
html[data-accent="academia"] .panel.parchment .btn-ghost{ background:rgba(38,35,28,.08); color:#26231C; }
html[data-accent="academia"] .panel.parchment .btn-text{ color:#7A5A33; }
html[data-accent="academia"] .panel.parchment .btn-danger{ color:#8A4A56; border-color:rgba(138,74,86,.55); }
html[data-accent="academia"] .panel.parchment .addcheck input{ border-color:rgba(38,35,28,.25); color:#26231C; }
html[data-accent="academia"] .panel.parchment .checkrow{ border-bottom-color:rgba(38,35,28,.14); }
html[data-accent="academia"] .panel.parchment .checkrow .box{ border-color:rgba(38,35,28,.3); }
html[data-accent="academia"] .panel.parchment .donebtn{ border-color:rgba(38,35,28,.3); color:var(--p-muted); }
html[data-accent="academia"] .panel.parchment .legend{ color:var(--p-muted); }
html[data-accent="academia"] .panel.parchment .chip.days{ background:#E3C9C4; border-color:#E3C9C4; color:#6B3A44; }
html[data-accent="academia"] .panel.parchment .chip.soon{ background:#E4D9BC; border-color:#E4D9BC; color:#6E5A2E; }
html[data-accent="academia"] .panel.parchment .bar{ background:#CBD6C2; }
html[data-accent="academia"] .panel.parchment .bar > i{ background:#C9A96A; }
html[data-accent="academia"] .panel.parchment .bar.knob::before{ background:#C9A96A; border:2px solid #F1E8D5; }
html[data-accent="academia"] .panel.parchment .prog-caption .big{ color:#26231C; }
html[data-accent="academia"] .panel.parchment .prog-caption{ color:var(--p-muted); }

/* Exam rows on parchment (Upcoming exams) */
html[data-accent="academia"] .exam-tile{ width:42px; height:42px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:#F2E4D5; flex:0 0 auto; }
html[data-accent="academia"] .exam-tile svg{ width:19px; height:19px; }
html[data-accent="academia"] .exrow{ border-bottom-color:rgba(38,35,28,.14); }
html[data-accent="academia"] .exrow .nm small{ color:var(--p-muted); }
html[data-accent="academia"] .exrow .cov{ color:var(--p-muted); }
html[data-accent="academia"] .exrow .cov b{ color:#26231C; }
html[data-accent="academia"] .panel.parchment .exrow.urgent{ box-shadow:inset 3px 0 0 #8A4A56; }
html[data-accent="academia"] .leaf-deco{ position:absolute; right:6px; bottom:6px; width:74px; height:96px; color:#9C8B62; opacity:.5; pointer-events:none; display:block; }
.leaf-deco{ display:none; }

/* Session rows on parchment */
html[data-accent="academia"] .panel.parchment .srow{ border-bottom-color:rgba(38,35,28,.14); }
html[data-accent="academia"] .panel.parchment .srow .st small{ color:var(--p-muted); }
html[data-accent="academia"] .panel.parchment .srow .st small .subj{ color:#7A5A33; }

/* Readiness rows on dark */
html[data-accent="academia"] .panel.dark-open{ background:transparent; border:0; border-top:1px solid var(--line); border-radius:0; padding:14px 2px 0; }
html[data-accent="academia"] .panel.dark-open .panel-h{ margin-bottom:4px; }

/* Insights */
html[data-accent="academia"] .insight-txt{ font-size:.95rem; line-height:1.65; color:#D8CBA6; }
html[data-accent="academia"] .nextfocus{ margin-top:14px; padding-top:12px; border-top:1px solid var(--hairline); }
html[data-accent="academia"] .nextfocus .nf-lbl{ display:flex; align-items:center; gap:8px; font-family:var(--font-head); font-weight:600; font-size:1.02rem; margin-bottom:4px; }
html[data-accent="academia"] .nextfocus .nf-lbl svg{ width:17px; height:17px; color:var(--accent-strong); }
html[data-accent="academia"] .nextfocus p{ font-size:.88rem; color:var(--muted); }

/* Bottom nav leaves + underline */
html[data-accent="academia"] .bottomnav{ background:linear-gradient(180deg,#0D1310,#0A0F0C); }
html[data-accent="academia"] .nav-btn.on::after{
  content:''; position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
  width:56%; height:2px; background:var(--accent-strong); border-radius:2px;
}

/* Legend */
html[data-accent="academia"] .legend .lp i{ background:#C9A96A; }
html[data-accent="academia"] .legend .lc i{ background:#6E8464; }

/* ==========================================================================
   4. THEME — CLEAN SCANDINAVIAN
   Airy, flat, precise. No cards where possible: hairlines, huge light
   numerals, 2px progress lines, 7/4 asymmetric desktop split, radius 3.
   ========================================================================== */
html[data-accent="scandinavian"]{
  --font-head:'Helvetica Neue',Helvetica,'Segoe UI',Roboto,'PingFang SC','Noto Sans SC',Arial,sans-serif;
  --r:3px; --r-btn:3px;
  --chart-planned:#46697F; --chart-done:#5E7D6C;
  --bg:#FBFBF9; --bg-glow:none;
  --text:#2B3640; --muted:#6E7B87;
  --panel:#EEF0F1; --panel-2:#F3F4F5;
  --line:rgba(43,54,64,.13); --hairline:rgba(43,54,64,.16);
  --accent:#46697F; --accent-strong:#3D5C70; --accent-ink:#FFFFFF;
  --primary:#2B3640; --primary-strong:#3A4753; --primary-ink:#F5F7F8;
  --p-bg:#E8EEF2; --p-ink:#2B3640; --p-muted:#6E7B87; --p-line:rgba(43,54,64,.12); --p-border:#E8EEF2;
  --ok:#5E7D6C; --ok-ink:#4A675A; --warn:#B08A3E; --danger:#A94A52; --danger-bg:rgba(169,74,82,.1);
  --nav-bg:rgba(251,251,249,.82); --nav-line:rgba(43,54,64,.12);
  --chip-bg:rgba(43,54,64,.06);
  --shadow-card:none; --shadow-pop:0 24px 60px rgba(43,54,64,.18);

  --modal-bg:#FFFFFF; --modal-ink:#2B3640;
  --toast-bg:#2B3640; --toast-ink:#F5F7F8;

}
html[data-accent="scandinavian"][data-mode="dark"]{
  --bg:#1A2027; --text:#E8ECEF; --muted:#93A1AC;
  --chart-planned:#8FB3C7; --chart-done:#7FA98F;
  --panel:#222B34; --panel-2:#1E262F;
  --line:rgba(232,236,239,.13); --hairline:rgba(232,236,239,.16);
  --accent:#8FB3C7; --accent-strong:#A5C4D6; --accent-ink:#16202A;
  --primary:#E8ECEF; --primary-strong:#fff; --primary-ink:#1A2027;
  --p-bg:#24303A; --p-ink:#E8ECEF; --p-muted:#93A1AC; --p-line:rgba(232,236,239,.12); --p-border:#24303A;
  --ok:#7FA98F; --ok-ink:#9CC3AA; --danger:#C96E75; --danger-bg:rgba(201,110,117,.14);
  --nav-bg:rgba(26,32,39,.8); --nav-line:rgba(232,236,239,.12);

  --track:rgba(232,236,239,.14);
  --modal-bg:#222B34; --modal-ink:#E8ECEF;
  --toast-bg:#E8ECEF; --toast-ink:#1A2027;
  --btn-dark-bg:#243039; --btn-dark-ink:#E8ECEF; --btn-dark-line:#31404C;
}
html[data-accent="scandinavian"] body{ letter-spacing:-.006em; }

html[data-accent="scandinavian"] .brand-name span{ letter-spacing:.3em; }

html[data-accent="scandinavian"] .streak-chip{ border-color:var(--line); color:var(--text); }

html[data-accent="scandinavian"] .eyebrow{ color:var(--accent); letter-spacing:.2em; }

html[data-accent="scandinavian"] .panel-h h3{ font-family:var(--font-body); font-weight:600; font-size:1.05rem; }

html[data-accent="scandinavian"] .card-progress{
  background:transparent; border:0; width:100%; margin:6px 0 0; border-radius:0; padding:18px 0 0;
}

  font-variant-numeric:tabular-nums;
}

html[data-accent="scandinavian"] .nav-btn{ font-size:.64rem; }
html[data-accent="scandinavian"] .nav-btn.on{ color:var(--text); }
html[data-accent="scandinavian"] .nav-btn.on::before{

}

/* ==========================================================================
   5. THEME — COZY STUDY SEASON
   Cream paper, layered overlapping cards, serif display, terracotta,
   botanical line art, ruled notebook session list.
   ========================================================================== */
html[data-accent="cozy"]{
  --font-head:Charter,'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,serif;
  --r:14px; --r-btn:9px;
  --chart-planned:#C9A66B; --chart-done:#7C8F6B;
  --bg:#FBF6EC; --bg-glow:none;
  --text:#3A2A1E; --muted:#8A7A66;
  --panel:#FFFDF8; --panel-2:#F7F0E2;
  --line:rgba(107,79,58,.15); --hairline:rgba(107,79,58,.18);

/* ==========================================================================
   6. RESPONSIVE — phone first (360–430), tablet 720, desktop 1000
   ========================================================================== */

/* --- Tablet & up: hero overlap grows; start-here + progress split --- */
@media (min-width:720px){
  .wrap{ padding:0 30px 120px; }
  .topbar-in{ padding:12px 30px; }
  .panel{ padding:24px; }
  .card{ padding:26px; }

  /* Academia + base: Start here full-width-ish; progress card sits ~40% across,
     dropped ~9rem into the start card's lower-right (in-flow, no clipping). */
  html[data-accent="academia"] .hero-cards .card-progress{
    width:min(56%,460px); margin:-9rem 1.5% 0 auto;
  }
  html[data-accent="academia"] .card-start{ margin-right:8%; }

  /* Cozy: keep the 3-card ladder overlapping, larger offsets */
  html[data-accent="cozy"] .hero-cards .card-progress{ width:78%; margin:-2.4rem 0 0 auto; }
  html[data-accent="cozy"] .hero-cards .card-upnext{ width:64%; margin:-2.2rem auto 0 12%; }

  /* Plan screen: chart + insights side by side (like reference) */
  .plan-grid{ display:grid; grid-template-columns:1.55fr 1fr; gap:20px; align-items:stretch; }
  .plan-grid .panel{ margin:0; }
  html[data-accent] .metric-row.three{ grid-template-columns:repeat(3,1fr); }
  html[data-accent] .metric-row.three .metric{ display:grid; grid-template-columns:22px 1fr; grid-template-rows:auto auto; column-gap:12px; align-items:center; padding:14px 20px; }
  html[data-accent] .metric-row.three .metric svg{ grid-row:1 / span 2; grid-column:1; }
  html[data-accent] .metric-row.three .metric .lbl{ grid-column:2; grid-row:1; }
  html[data-accent] .metric-row.three .metric .val{ grid-column:2; grid-row:2; font-size:1.9rem; margin-top:2px; }
  html[data-accent] .metric-row.three .metric + .metric{ border-top:0; border-left:1px solid var(--p-line); }
  html[data-accent="scandinavian"] .metric-row.three .metric .val{ font-size:2.2rem; font-weight:200; letter-spacing:-.03em; }

  /* Scandinavia: asymmetric 7/4 split, no overlap */
  html[data-accent="scandinavian"] .scandi-split{
    display:grid; grid-template-columns:7fr 4fr; gap:40px; align-items:start;
  }
  html[data-accent="scandinavian"] .scandi-split .col-b{ padding-top:76px; }
  html[data-accent="scandinavian"] .card-start{ margin-right:0; }

  /* Cozy desktop mirrors the reference: heading column left, card stack right */
  html[data-accent="cozy"] .cozy-split{
    display:grid; grid-template-columns:0.9fr 1.1fr; gap:44px; align-items:start; margin-top:10px;
  }
  html[data-accent="cozy"] .cozy-split .col-a{ position:sticky; top:96px; }
  html[data-accent="cozy"] .cozy-split .col-b .hero-cards{ margin-top:0; }
  html[data-accent="cozy"] .cozy-split .col-b .card-upnext{ width:70%; margin:-2.2rem auto 0 16%; }

  /* Progress screen splits */
  .prog-split{ display:grid; grid-template-columns:1.6fr 1fr; gap:20px; align-items:stretch; }
  .prog-split .panel{ margin:0; }
}

@media (min-width:1000px){
  .headline{ font-size:2.8rem; }
  html[data-accent="cozy"] .headline{ font-size:3.3rem; }
  html[data-accent="scandinavian"] .headline{ font-size:3.6rem; }
  .mast-illus{ width:min(38%,400px); right:0; }
}

/* Small phones: keep overlapped hero readable */
@media (max-width:379px){
  .card-progress{ width:94%; }
  html[data-accent="cozy"] .hero-cards .card-upnext{ width:88%; margin-left:8%; }
}

/* ==========================================================================
   7. PRINT (Plan screen as clean document) + reduced motion
   ========================================================================== */
@media print{
  html[data-accent]{ --bg:#FFFFFF; --bg-glow:none; --text:#161616; --muted:#5A5A5A;
    --panel:#FFFFFF; --line:#D8D8D8; --hairline:#D8D8D8; --accent:#7A6233; --accent-strong:#7A6233;
    --nav-bg:#FFFFFF; --chip-bg:#F2F2F2; --track:#E3E3E3; }
  html[data-accent] body{ background:#fff !important; }
  .topbar,.bottomnav,.mast-actions,.mast-illus,.no-print,.toast-wrap,.modal-overlay,.navleaf,.leaf-deco{ display:none !important; }
  .screen{ display:none !important; }
  #screen-plan{ display:block !important; }
  .wrap{ padding:0 !important; max-width:none; }
  .panel{ break-inside:avoid; border:1px solid #DDD; box-shadow:none !important; }
  .headline{ color:#111; }
  html[data-accent="academia"] .panel.parchment{ background:#fff; border-color:#CCC; color:#161616; }
  html[data-accent="academia"] .panel.parchment *{ color:#161616 !important; }
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
}

<script>
'use strict';
/* ============================== STATE ============================== */
const LS_KEY='catchup-planner.v1';
const EXAM_COLORS=['#8A4A56','#46697F','#66794F','#B4603A','#7A6FA0','#8A7448'];
let S=null;

function defaults(){return{
  v:1, theme:'academia', mode:'auto',
  capacity:3, badDay:false,
  exams:[], sessions:[],
  seq:1, xp:0, focusLog:{},
  replannedAt:null, created:iso(new Date()),
  screen:'today'
};}
function uid(p){ return p+'-'+(S.seq++); }
function load(){
  let d=defaults();
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){ const j=JSON.parse(raw); d=Object.assign(d,j);
      d.exams=Array.isArray(j.exams)?j.exams:[];
      d.sessions=Array.isArray(j.sessions)?j.sessions:[];
      d.focusLog=j.focusLog&&typeof j.focusLog==='object'?j.focusLog:{};
      if(typeof d.xp!=='number'||!isFinite(d.xp)) d.xp=0;
      if(!(d.capacity>0)) d.capacity=3;
      // keep seq beyond any existing id suffix
      let mx=10;
      d.exams.concat(d.sessions).forEach(x=>{ const n=parseInt(String(x.id).split('-').pop(),10); if(n>=mx) mx=n+1; });
      d.seq=mx;
    }
  }catch(e){ /* corrupted save: keep defaults, never wipe silently */ }
  S=d;
}
function save(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(e){ toast('Could not save — storage unavailable.'); } }

/* ============================ COMPUTED ============================ */
const examById=id=>S.exams.find(e=>e.id===id);
const examsByDate=()=>S.exams.slice().sort((a,b)=>a.date<b.date?-1:1);
const daysLeft=ex=>diffD(ex.date,tISO());
const coverage=ex=>ex.topics.length? ex.topics.filter(t=>t.done).length/ex.topics.length : 0;
const sessOfExam=exid=>S.sessions.filter(s=>s.examId===exid);
const hoursLeftExam=ex=>sessOfExam(ex.id).filter(s=>!s.done).reduce((a,s)=>a+s.hours,0);
function riskOf(ex){
  const dl=daysLeft(ex);
  if(dl<0) return {k:'past',label:'Past due'};
  const need=hoursLeftExam(ex), cap=Math.max(.5,S.capacity*(S.badDay?0.5:1));
  if(dl===0) return {k:'bad',label:'Exam today'};
  // FIX #6: a fully prepared exam is never "Urgent"
  if(ex.topics.length&&ex.topics.every(t=>t.done)&&need<=0) return {k:'ok',label:'On track'};
  if(dl<=2) return {k:'bad',label:'Urgent'};
  if(need>cap*dl) return {k:'bad',label:'At risk'};
  if(need>cap*dl*0.65) return {k:'warn',label:'Tight'};
  return {k:'ok',label:'On track'};
}
const sessionsOn=d=>S.sessions.filter(s=>s.date===d);
const undonePast=()=>S.sessions.filter(s=>!s.done&&s.date<tISO())
  .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.seq-b.seq);
const todayList=()=>S.sessions.filter(s=>s.date===tISO())
  .sort((a,b)=>(a.done?1:0)-(b.done?1:0)||a.seq-b.seq);
function nextSession(){
  const t=tISO();
  const rank={}; examsByDate().forEach((e,i)=>rank[e.id]=i);
  return S.sessions.filter(s=>!s.done&&s.date<=t)
    .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(rank[a.examId]-rank[b.examId])||(a.seq-b.seq))[0]||null;
}
function partOf(s){
  const list=sessOfExam(s.examId).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.seq-b.seq);
  return {i:list.findIndex(x=>x.id===s.id)+1,n:list.length};
}
const todayPlanned=()=>sessionsOn(tISO()).reduce((a,s)=>a+s.hours,0);
const studiedToday=()=>Math.max(S.sessions.filter(s=>s.done&&s.doneAt===tISO()).reduce((a,s)=>a+s.hours,0),(S.focusLog[tISO()]||0)/3600); // FIX #5: no double counting
function catchupStatus(){
  const t=tISO();
  const planned=S.sessions.filter(s=>s.date<=t).reduce((a,s)=>a+s.hours,0);
  const done=S.sessions.filter(s=>s.done&&s.date<=t).reduce((a,s)=>a+s.hours,0);
  if(planned<=0) return {k:'ok',label:'No plan yet'};
  const r=done/planned;
  if(r>=0.9) return {k:'ok',label:'On pace'};
  if(r>=0.6) return {k:'warn',label:'Building momentum'};
  return {k:'bad',label:'Behind by '+fmtH(planned-done)};
}
const wholePlan=()=>{
  const done=S.sessions.filter(s=>s.done).length, total=S.sessions.length;
  return {done,total};
};
function calcStreak(){
  const set=new Set(S.sessions.filter(s=>s.done&&s.doneAt).map(s=>s.doneAt));
  let d=tISO(); if(!set.has(d)) d=addD(d,-1);
  let c=0; while(set.has(d)){ c++; d=addD(d,-1); }
  return c;
}
const levelInfo=()=>{ const per=120, lv=Math.floor(S.xp/per)+1, into=S.xp%per; return {lv,into,per,next:per-into}; };
function last7(){ // rolling window: 3 days back .. today .. 3 days forward
  const t=tISO();
  const days=[];
  for(let i=-3;i<=3;i++){
    const d=addD(t,i);
    const planned=sessionsOn(d).reduce((a,s)=>a+s.hours,0);
    const done=S.sessions.filter(s=>s.done&&s.doneAt===d).reduce((a,s)=>a+s.hours,0);
    days.push({date:d,planned,done,l1:DAYS[pIso(d).getDay()].slice(0,3),l2:pIso(d).getDate()+' '+MON3[pIso(d).getMonth()]});
  }
  return days;
}
const pace7=()=>{ const ds=last7(), t=tISO();
  let p=0,c=0; ds.forEach(d=>{ if(d.date<=t){p+=d.planned;c+=d.done;} });
  return p>0?c/p:0;
};
const nextExam=()=>examsByDate().find(e=>daysLeft(e)>=0)||null;

/* ============================ RE-PLAN ============================ */
function newSession(examId,topicId,title,hours,date){
  return {id:uid('se'),examId,topicId,title,date:date||tISO(),hours:Math.round(hours*100)/100,
    done:false,doneAt:null,checklist:[],notes:'',seq:S.seq++};
}
function replan(){
  const t=tISO();
  if(!S.exams.length){ toast('Add an exam first, then re-plan.'); return; }
  // FIX #3: only plan for exams that have not happened yet
  const order=examsByDate().filter(e=>daysLeft(e)>=0);
  if(!order.length){ toast('No upcoming exams to plan for.'); return; }
  const cap=Math.max(.5,S.capacity*(S.badDay?0.5:1));
  const active=new Set(order.map(e=>e.id));
  const pool=S.sessions.filter(s=>!s.done&&active.has(s.examId));
  const fresh=[];
  // synthesize sessions for active topics that have none
  order.forEach(ex=>ex.topics.forEach(tp=>{
    if(tp.done) return;
    const has=S.sessions.some(s=>s.examId===ex.id&&s.topicId===tp.id);
    if(!has){
      const parts=Math.max(1,Math.ceil(tp.hrs/2));
      // FIX #15: split in half-hour steps so the parts add up to the topic hours
      let left=Math.max(1,Math.round(tp.hrs*2));
      for(let i=0;i<parts;i++){
        const h=Math.max(1,Math.ceil(left/(parts-i))); left-=h;
        const ns=newSession(ex.id,tp.id,tp.name,h/2);
        fresh.push(ns); pool.push(ns);
      }
    }
  }));
  if(!pool.length){ toast('Nothing to schedule \u2014 mark some topics as not-yet-studied.'); return; }
  S.sessions.push.apply(S.sessions,fresh); // FIX #1: new sessions are now saved
  const lastDate=order.reduce((m,e)=>e.date>m?e.date:m,order[0].date);
  const days={}; const dayList=[];
  for(let d=t;d<=lastDate;d=addD(d,1)){ days[d]=cap; dayList.push(d); }
  // FIX #4: a session may only sit between today and the day before its exam
  const allowed={};
  order.forEach(e=>{ const lastOk=diffD(e.date,t)<=1?t:addD(e.date,-1); allowed[e.id]=dayList.filter(d=>d<=lastOk); });
  const queues={}; order.forEach(e=>{ queues[e.id]=pool.filter(s=>s.examId===e.id).sort((a,b)=>a.seq-b.seq); });
  let placed=0, overflow=0, ei=0, guard=pool.length*order.length+10;
  while(placed<pool.length&&guard-->0){
    const exId=order[ei%order.length].id; ei++;
    const q=(queues[exId]||[]).find(s=>!s._p);
    if(!q) continue;
    const cand=allowed[exId];
    let target=null,backup=cand[0],bestRem=-1;
    for(const d of cand){
      if(days[d]>=q.hours-1e-9){ target=d; break; }
      if(days[d]>bestRem){ bestRem=days[d]; backup=d; }
    }
    if(target==null){ target=backup; overflow++; }
    days[target]=Math.max(0,days[target]-q.hours);
    q.date=target; q._p=true; placed++;
  }
  pool.forEach(s=>delete s._p);
  S.replannedAt=new Date().toISOString();
  save();
  let msg='Re-planned '+pl(placed,'session')+' \u00b7 about '+fmtH(cap)+' per day';
  if(overflow) msg+=' \u00b7 '+overflow+' day(s) exceed capacity';
  toast(msg);
  renderAll();
}

/* ============================ ACTIONS ============================ */
function markDone(id,force){
  const s=S.sessions.find(x=>x.id===id); if(!s) return;
  s.done=(force===undefined)?!s.done:!!force;
  s.doneAt=s.done?tISO():null;
  S.xp=clamp(S.xp+(s.done?15:-15),0,1e9);
  save();

  if(!up.length){ toast('No upcoming sessions to export.'); return; }
  const escIC=s=>String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CatchUp Planner//EN','CALSCALE:GREGORIAN'];

      'DTSTART;VALUE=DATE:'+ds,'DTEND;VALUE=DATE:'+addD(s.date,1).replace(/-/g,''), // FIX #2

      'END:VEVENT');

  out.push('END:VCALENDAR');
  const blob=new Blob([out.join('\r\n')],{type:'text/calendar'});

  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast(pl(up.length,'session')+' exported to calendar file.');
}

/* ============================== PLAN ============================== */
function chartSVG(days){
  const compact=window.innerWidth<560;
  const W=compact?360:640, H=compact?238:252, L=compact?30:44, B=compact?192:206, T=16;
  const fs1=compact?10:11, fs2=compact?9.5:10.5;
  const mx=Math.max(...days.map(d=>Math.max(d.planned,d.done)),2);
  const max=Math.max(2,Math.ceil(mx/2)*2);
  const stepv=max>8?4:2;
  const n=days.length, step=(W-L-14)/n;
  let g='';
  for(let v=0;v<=max;v+=stepv){
    const y=B-(v/max)*(B-T);
    g+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-6)+'" y2="'+y+'" stroke="currentColor" stroke-opacity=".13" stroke-width="1"/>'
     +'<text x="'+(L-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="'+fs1+'" fill="currentColor" fill-opacity=".55" font-variant-numeric="tabular-nums">'+v+'h</text>';
  }
  days.forEach((d,i)=>{
    const cx=L+7+i*step+step/2;
    const bw=Math.min(compact?17:26,step*0.36), dw=Math.min(compact?7:11,step*0.15);

  const s=S.sessions.find(x=>x.id===sid); if(!s) return;
  stopFocusTick();
  F={sid,total:Math.max(300,Math.round(s.hours*3600)),left:0,running:false,unlogged:0,spentAll:0,iv:null,last:0};
  F.left=F.total;
  renderFocusModal(s);
  F.iv=setInterval(()=>{ focusTick(); updateTimerUI(); },1000);
  updateTimerUI();
}
function stopFocusTick(){ if(F.iv){ clearInterval(F.iv); F.iv=null; } }
function logFocus(flush){
  // FIX #9: keep leftover seconds; flush=true logs everything
  const secs=flush?F.unlogged:Math.floor(F.unlogged/60)*60;
  if(secs>0&&F.sid){
    const t=tISO(); S.focusLog[t]=(S.focusLog[t]||0)+secs; F.unlogged-=secs; save();
  }
}
// FIX #10: timer uses real clock time, so it stays accurate in background tabs
function focusTick(){
  if(!F.running) return;
  const d=Math.floor((Date.now()-F.last)/1000);
  if(d<1) return;
  F.last+=d*1000; F.spentAll+=d; F.unlogged+=d; F.left=F.total-F.spentAll;
  if(F.left<=0){
    const over=-F.left;
    if(over>0){ F.spentAll-=over; F.unlogged=Math.max(0,F.unlogged-over); }
    F.left=0; F.running=false; logFocus(true); toast('Focus complete \u2014 nice work.');
  }
}
function renderFocusModal(s){
  const ex=examById(s.examId);
  openModal(
    modalHead('Focus session',subjectChip(ex))
    +'<h3 class="sess-title" style="font-size:1.25rem;text-align:center">'+esc(s.title)+'</h3>'
    +'<div class="timer-big num" id="tmrBig">'+fmtMMSS(F.left)+'</div>'
    +'<p class="timer-sub" id="tmrSub">'+(F.running?'Focusing\u2026':'Paused')+' \u00b7 '+Math.round(F.spentAll/60)+' min focused \u00b7 planned '+fmtH(s.hours)+'</p>'
    +'<div class="card-btns" style="justify-content:center">'
    +'<button class="btn btn-primary" id="tmrToggle" data-action="focus-toggle">'+(F.running?icon('moon',18)+'Pause':icon('sun',18)+'Start')+'</button>'
    +'<button class="btn btn-outline" data-action="focus-plus">'+icon('plus',18)+'5 min</button>'
    +'<button class="btn btn-ghost" data-action="focus-end">End & log</button>'
    +'</div>'
    +'<button class="btn btn-primary btn-block" style="margin-top:12px" data-action="mark-done-close" data-id="'+s.id+'">'+icon('check',18)+'Mark session done</button>'
  );
}
function updateTimerUI(){
  const b=$('#tmrBig'),sub=$('#tmrSub'),tog=$('#tmrToggle');
  if(b) b.textContent=fmtMMSS(F.left);
  if(sub) sub.textContent=(F.running?'Focusing\u2026':'Paused')+' \u00b7 '+Math.round(F.spentAll/60)+' min focused';
  if(tog) tog.innerHTML=(F.running?icon('moon',18)+'Pause':icon('sun',18)+'Start');
}

/* ------------------------- Exam add / edit ------------------------- */
function openExamModal(eid){
  const ex=eid?examById(eid):null;
  const color=ex?ex.color:EXAM_COLORS[0];
  openModal(
    modalHead(ex?'Edit exam':'Add exam')
    +'<div class="field"><label for="exam-subject">Subject</label><input id="exam-subject" type="text" value="'+esc(ex?ex.subject:'')+'" placeholder="e.g. Mathematics"></div>'
    +'<div class="field"><label for="exam-date">Exam date</label><input id="exam-date" type="date" value="'+(ex?ex.date:addD(tISO(),14))+'" min="'+tISO()+'"></div>'
    +'<div class="field"><label>Colour</label><div class="swatches" id="exam-swatches">'
    +EXAM_COLORS.map(c=>'<button class="swatch '+(c===color?'on':'')+'" data-c="'+c+'" style="background:'+c+'" aria-label="Colour '+c+'"></button>').join('')
    +'</div></div>'
    +(!ex?'<div class="field"><label for="exam-topics">Topics \u2014 one per line <span style="text-transform:none;letter-spacing:0">(name, hours)</span></label><textarea id="exam-topics" placeholder="Quadratic Equations, 3\nTrigonometry, 2.5"></textarea></div>':'')
    +'<div class="modal-foot"><button class="btn btn-outline" data-action="close-modal">Cancel</button>'
    +'<button class="btn btn-primary" data-action="save-exam" data-id="'+(ex?ex.id:'')+'">'+icon('check',18)+(ex?'Save changes':'Add exam')+'</button></div>'
  );
  $$('#exam-swatches .swatch').forEach(b=>b.addEventListener('click',()=>{
    $$('#exam-swatches .swatch').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  }));
}
function saveExam(eid){
  const subj=$('#exam-subject').value.trim();
  const date=$('#exam-date').value;
  if(!subj){ toast('Give the exam a subject name.'); return; }
  if(!date){ toast('Pick an exam date.'); return; }
  const sw=$('#exam-swatches .swatch.on'); const color=sw?sw.dataset.c:EXAM_COLORS[0];
  if(eid){
    const ex=examById(eid); ex.subject=subj; ex.date=date; ex.color=color;
    toast('Exam updated \u2014 re-plan to fit the new date.');
  }else{
    const topics=($('#exam-topics').value||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const m=l.match(/^(.*?)[,;]\s*(\d+(?:\.\d+)?)\s*h?$/); 
      return m?{id:uid('tp'),name:m[1].trim(),hrs:clamp(parseFloat(m[2])||2,0.5,12),done:false}
              :{id:uid('tp'),name:l,hrs:2,done:false};
    });
    S.exams.push({id:uid('ex'),subject:subj,date,color,topics});
    toast('Exam added \u2014 now re-plan to generate study days.');
  }
  save(); closeModal(); renderAll();
}
function openSessionModal(eid){
  const ex=examById(eid); if(!ex) return;
  const opts=ex.topics.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('')+'<option value="__custom">Custom\u2026</option>';
  openModal(
    modalHead('Add study session',subjectChip(ex))
    +'<div class="field"><label for="ss-topic">Topic</label><select id="ss-topic">'+opts+'</select></div>'
    +'<div class="field"><label for="ss-title">Title</label><input id="ss-title" type="text" value="'+esc(ex.topics[0]?ex.topics[0].name:'')+'" placeholder="What will you work on?"></div>'
    +'<div class="field"><label for="ss-date">Date</label><input id="ss-date" type="date" value="'+tISO()+'" min="'+tISO()+'"></div>'
    +'<div class="field"><label for="ss-hours">Hours</label><input id="ss-hours" type="number" value="1.5" min="0.5" max="8" step="0.5"></div>'
    +'<div class="modal-foot"><button class="btn btn-outline" data-action="close-modal">Cancel</button>'
    +'<button class="btn btn-primary" data-action="save-session" data-eid="'+eid+'">'+icon('check',18)+'Add session</button></div>'
  );
  $('#ss-topic').addEventListener('change',e=>{
    const t=ex.topics.find(x=>x.id===e.target.value);
    $('#ss-title').value=t?t.name:'';
  });
}
function confirmReplan(){
  const poolN=S.sessions.filter(s=>!s.done).length;
  const cap=Math.max(.5,S.capacity*(S.badDay?0.5:1));
  openModal(
    modalHead('Re-plan?')
    +'<p style="font-size:.95rem">This moves <b class="num">'+poolN+'</b> unfinished session'+(poolN===1?'':'s')+(poolN?'':' (plus any new topics)')+' into balanced days up to your exams \u2014 about <b class="num">'+fmtH(cap)+'</b> per day'+(S.badDay?' (bad day mode is on)':'')+'. Finished sessions stay exactly where they are.</p>'
    +'<div class="modal-foot"><button class="btn btn-outline" data-action="close-modal">Cancel</button>'
    +'<button class="btn btn-primary" data-action="do-replan">'+icon('refresh',18)+'Re-plan now</button></div>'
  );
}
function confirmDemo(){
  openModal(
    modalHead('Load demo data?')
    +'<p style="font-size:.95rem">This replaces your current exams and sessions with a sample plan (3 exams, 19 sessions, a 3-day streak). Your theme and capacity are kept.</p>'
    +'<div class="modal-foot"><button class="btn btn-outline" data-action="close-modal">Cancel</button>'
    +'<button class="btn btn-primary" data-action="do-demo">'+icon('sparkle',18)+'Load demo</button></div>'
  );
}
function confirmReset(){
  openModal(
    modalHead('Reset everything?')
    +'<p style="font-size:.95rem">This permanently deletes all exams, sessions, XP and streak data from this browser. There is no undo.</p>'
    +'<div class="modal-foot"><button class="btn btn-outline" data-action="close-modal">Keep my data</button>'
    +'<button class="btn btn-danger" data-action="do-reset">'+icon('trash',18)+'Delete everything</button></div>'
  );
}

/* ============================== EVENTS ============================== */
function addTopic(eid,value){
  const ex=examById(eid); if(!ex||!value.trim()) return;
  const m=value.trim().match(/^(.*?)[,;]\s*(\d+(?:\.\d+)?)\s*h?$/);
  const name=m?m[1].trim():value.trim();
  const hrs=m?clamp(parseFloat(m[2])||2,0.5,12):2;
  ex.topics.push({id:uid('tp'),name,hrs,done:false});
  save(); toast('Topic added'); renderAll();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');
  if(!t) return;
  const act=t.dataset.action, id=t.dataset.id;
  switch(act){
    case 'go': go(t.dataset.nav); break;
    case 'replan': confirmReplan(); break;
    case 'do-replan': closeModal(); replan(); break;
    case 'export-ics': exportICS(); break;
    case 'print-plan': window.print(); break;
    case 'load-demo': confirmDemo(); break;
    case 'do-demo': loadDemo(); closeModal(); break;
    case 'reset-all': confirmReset(); break;
    case 'do-reset': { const keep={theme:S.theme,mode:S.mode,capacity:S.capacity,badDay:S.badDay}; S=Object.assign(defaults(),keep); save(); applyMode(); closeModal(); renderAll(); toast('All data cleared.'); break; }
    case 'mark-done': e.stopPropagation(); markDone(id); break;
    case 'mark-done-close': e.stopPropagation(); markDone(id); closeModal(); break;
    case 'open-session': openSession(id); break;
    case 'start-focus': startFocus(id); break;
    case 'focus-toggle':
      if(F.running){ focusTick(); F.running=false; logFocus(false); }
      else if(F.left<=0){ toast('Timer finished \u2014 tap +5 min to keep going.'); }
      else{ F.running=true; F.last=Date.now(); }
      updateTimerUI(); break;
    case 'focus-plus': F.total+=300; F.left=F.total-F.spentAll; updateTimerUI(); break;
    case 'focus-end': focusTick(); F.running=false; logFocus(true); toast('Focus time logged.'); closeModal(); renderAll(); break;
    case 'toggle-check': toggleCheck(t.dataset.sid,t.dataset.cid); if(!$('#overlay').hidden) openSession(t.dataset.sid); break;
    case 'add-check-btn': { const inp=$('#check-in'); if(inp){ addCheck(inp.dataset.sid,inp.value); const c2=$('#check-in'); if(c2) c2.value=''; } break; }
    case 'close-modal': closeModal(); break;
    case 'add-exam': openExamModal(''); break;
    case 'edit-exam': openExamModal(id); break;
    case 'save-exam': saveExam(id); break;
    case 'del-exam': {
      const ex=examById(id); if(!ex) break;
      openModal(modalHead('Delete '+esc(ex.subject)+'?')
        +'<p style="font-size:.95rem">Removes the exam, its topics and its sessions from the plan.</p>'
        +'<div class="modal-foot"><button class="btn btn-outline" data-action="close-modal">Cancel</button>'
        +'<button class="btn btn-danger" data-action="do-del-exam" data-id="'+id+'">'+icon('trash',18)+'Delete exam</button></div>');
      break; }
    case 'do-del-exam':
      S.exams=S.exams.filter(x=>x.id!==id);
      S.sessions=S.sessions.filter(s=>s.examId!==id);
      save(); closeModal(); toast('Exam deleted'); renderAll(); break;
    case 'toggle-topic': {
      const ex2=examById(t.dataset.eid); const tp=ex2&&ex2.topics.find(x=>x.id===t.dataset.tid);
      if(tp){ tp.done=!tp.done; save(); renderAll(); } break; }
    case 'del-topic': {
      const ex3=examById(t.dataset.eid);
      if(ex3){ ex3.topics=ex3.topics.filter(x=>x.id!==t.dataset.tid); save(); renderAll(); } break; }
    case 'add-topic': {
      const inp=document.querySelector('.topic-in[data-eid="'+t.dataset.eid+'"]');
      if(inp){ addTopic(t.dataset.eid,inp.value); } break; }
    case 'add-session': openSessionModal(t.dataset.eid); break;
    case 'save-session': {
      const ex4=examById(t.dataset.eid); if(!ex4) break;
      const tpid=$('#ss-topic').value; const title=$('#ss-title').value.trim();
      const date=$('#ss-date').value||tISO(); const hours=clamp(parseFloat($('#ss-hours').value)||1.5,0.5,8);
      if(!title){ toast('Give the session a title.'); break; }
      S.sessions.push(newSession(ex4.id,tpid==='__custom'?null:tpid,title,hours,date));
      save(); closeModal(); toast('Session added'); renderAll(); break; }
    case 'set-theme': setTheme(t.dataset.theme); toast('Theme applied \u2014 '+(THEMES.find(x=>x.id===t.dataset.theme)||{name:t.dataset.theme}).name+'.'); break;
    case 'set-mode': S.mode=t.dataset.mode; save(); applyMode(); renderAll(); break;
    case 'cap-delta': S.capacity=clamp(S.capacity+parseInt(t.dataset.d,10),1,10); save(); renderAll(); break;
    case 'toggle-badday': S.badDay=!S.badDay; save(); renderAll(); toast(S.badDay?'Bad day mode on \u2014 re-plan for a lighter load.':'Bad day mode off.'); break;
    case 'view-today': go('today'); break;
  }
});
$('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#overlay').hidden) closeModal();
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('.topic-in')){ e.preventDefault(); addTopic(e.target.dataset.eid,e.target.value); }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.donebtn')){ e.preventDefault(); markDone(e.target.dataset.id); } // FIX #12
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][data-action="go"]')){ e.preventDefault(); go(e.target.dataset.nav); }
});

/* ============================== ROUTER ============================== */
const RENDERERS={today:renderToday,plan:renderPlan,progress:renderProgress,exams:renderExams,settings:renderSettings};
function renderScreen(n){ (RENDERERS[n]||renderToday)(); }
function renderAll(){ renderChrome(); renderScreen(S.screen||'today'); }
function go(n){
  if(!RENDERERS[n]) n='today';
  S.screen=n; save();
  $$('.screen').forEach(s=>s.classList.remove('active'));
  $('#screen-'+n).classList.add('active');
  renderChrome(); renderScreen(n);
  window.scrollTo(0,0);
}

/* ============================== INIT ============================== */
const FIRST_VISIT=(function(){ try{ return localStorage.getItem(LS_KEY)===null; }catch(e){ return true; } })();
load();
applyMode();
if(FIRST_VISIT) loadDemo(); // DEMO: sample plan on first visit
go(NAVS.some(x=>x[0]===S.screen)?S.screen:'today');
</script>
